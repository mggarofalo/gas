services:
  init:
    image: alpine:3.21
    container_name: gas-init
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for secret in pg_password s3_access_key s3_secret_key jwt_key; do
          if [ ! -f "/secrets/$${secret}" ]; then
            tr -dc 'A-Za-z0-9+/' < /dev/urandom | head -c 48 > "/secrets/$${secret}"
            chmod 644 "/secrets/$${secret}"
            echo "Generated /secrets/$${secret}"
          else
            echo "/secrets/$${secret} already exists, skipping"
          fi
        done
        # Admin password: 44 alphanum + guaranteed uppercase, digit, and special char
        if [ ! -f "/secrets/admin_password" ]; then
          base=$$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 44)
          printf '%s@A1!' "$${base}" > "/secrets/admin_password"
          chmod 644 "/secrets/admin_password"
          echo "Generated /secrets/admin_password"
        else
          echo "/secrets/admin_password already exists, skipping"
        fi
        echo "Secrets ready"
    volumes:
      - secrets:/secrets
    networks: []

  db:
    image: postgres:17
    container_name: gas-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gas
      - POSTGRES_PASSWORD_FILE=/secrets/pg_password
      - POSTGRES_DB=gastracker
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - secrets:/secrets:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gas -d gastracker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    networks:
      - gas-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    container_name: gas-s3mock
    restart: unless-stopped
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/s3mockroot
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=${S3__BucketName:-gas-receipts}
    volumes:
      - s3mock-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - gas-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  app:
    image: ghcr.io/mggarofalo/gas:latest
    container_name: gas-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-America/New_York}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-gas}
      - POSTGRES_DB=${POSTGRES_DB:-gastracker}
      - S3__Endpoint=${S3__Endpoint:-s3mock:9090}
      - S3__BucketName=${S3__BucketName:-gas-receipts}
      - S3__UseSSL=${S3__UseSSL:-false}
      - AllowedOrigins=${AllowedOrigins:-*}
      - Paperless__Enabled=${Paperless__Enabled:-false}
      - AdminSeed__Email=${AdminSeed__Email:-admin@gastracker.local}
      - AdminSeed__FirstName=${AdminSeed__FirstName:-Admin}
      - AdminSeed__LastName=${AdminSeed__LastName:-User}
      - Jwt__Issuer=${Jwt__Issuer:-gas-api}
      - Jwt__Audience=${Jwt__Audience:-gas-app}
    depends_on:
      db:
        condition: service_healthy
      s3mock:
        condition: service_healthy
    volumes:
      - secrets:/secrets:ro
      - dp-keys:/dp-keys
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - gas-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backup:
    image: postgres:17
    container_name: gas-backup
    profiles:
      - backup
    restart: "no"
    entrypoint: /scripts/backup.sh
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-db}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-gas}
      - POSTGRES_DB=${POSTGRES_DB:-gastracker}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - secrets:/secrets:ro
      - backups:/backups
      - ./scripts:/scripts:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - gas-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  secrets:
  dp-keys:
  db-data:
  minio-data: # Retained for rollback; never run docker compose down -v during migration.
  s3mock-data:
  backups:

networks:
  gas-net:
    driver: bridge
