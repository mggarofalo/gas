name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  receipt-migration:
    name: Receipt migration (MinIO to S3Mock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build native migration test tools from pinned source
        env:
          GOBIN: ${{ runner.temp }}/migration-tools
          CGO_ENABLED: "0"
        run: |
          go install github.com/minio/mc@RELEASE.2025-03-12T17-29-24Z
          go install github.com/minio/minio@RELEASE.2025-03-12T18-04-18Z
      - name: Check scripts and Compose
        run: |
          shellcheck -x -P scripts scripts/export-minio-receipts.sh scripts/import-s3mock-receipts.sh scripts/receipt-migration-common.sh tests/migration/run.sh
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.migration.yml config --quiet
      - name: Build storage smoke test
        run: dotnet build tests/GasTracker.Tests/GasTracker.Tests.csproj -c Release
      - name: Test export, import, recovery, conflicts, persistence and AWS SDK
        env:
          MIGRATION_TEST_TOOLS: ${{ runner.temp }}/migration-tools
        run: bash tests/migration/run.sh

  backend:
    name: Build & Check (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/GasTracker/GasTracker.slnx

      - name: Build
        run: dotnet build src/GasTracker/GasTracker.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/GasTracker.Tests/GasTracker.Tests.csproj -c Release --no-build --collect:"XPlat Code Coverage"

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"**/coverage.cobertura.xml" -targetdir:coverage/backend -reporttypes:HtmlSummary

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

  frontend:
    name: Build & Check (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: src/frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: src/frontend

      - name: Test with coverage
        run: npm run test:coverage
        working-directory: src/frontend

      - name: Build
        run: npm run build
        working-directory: src/frontend

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend
